apiVersion: v1
kind: Service
metadata:
  name: director
  labels:
    app: director
spec:
  type: NodePort
  selector:
    app: director
  ports:
    - name: http
      port: 5000
      targetPort: 5000
      nodePort: 30003
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: director
  labels:
    app: director
spec:
  # jedna replika, kako bi postojala samo jedna nadzorna nit za glasanje
  replicas: 1
  selector:
    matchLabels:
      app: director
  template:
    metadata:
      labels:
        app: director
    spec:
      containers:
        - name: director
          image: iep/director:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: iep-config
            - secretRef:
                name: iep-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              cpu: "100m"
              memory: "192Mi"
            limits:
              memory: "768Mi"
