apiVersion: v1
kind: Service
metadata:
  name: authentication
  labels:
    app: authentication
spec:
  type: NodePort
  selector:
    app: authentication
  ports:
    - name: http
      port: 5000
      targetPort: 5000
      nodePort: 30001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentication
  labels:
    app: authentication
spec:
  replicas: 1
  selector:
    matchLabels:
      app: authentication
  template:
    metadata:
      labels:
        app: authentication
    spec:
      # ---------------------------------------------------------------
      # Automatska inicijalizacija relacione baze podataka: kreiranje
      # tabela, uloga i pocetnog naloga direktora fonda.
      # ---------------------------------------------------------------
      initContainers:
        - name: migrate
          image: iep/authentication:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "migrate.py"]
          envFrom:
            - configMapRef:
                name: iep-config
            - secretRef:
                name: iep-secret
      containers:
        - name: authentication
          image: iep/authentication:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: iep-config
            - secretRef:
                name: iep-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              memory: "512Mi"
